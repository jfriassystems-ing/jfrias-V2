<div id="sec-cotizar" class="section active">
    <div class="cotizar-container">
        <h1 class="titulo-cotizar">Cotiza tu Proyecto</h1>
        <p class="lead-cotizar">Cuéntame qué necesita tu negocio y recibe una propuesta personalizada en <strong>menos de 24 horas</strong></p>
       
        <form id="form-cotizacion" class="form-cotizacion">
            <div class="form-group">
                <label for="nombre"><i class="fa-solid fa-user"></i> Nombre o Empresa *</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: Constructora Frias / Julio Frias">
            </div>
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Correo electrónico *</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label for="telefono"><i class="fa-brands fa-whatsapp"></i> Teléfono / WhatsApp *</label>
                <input type="tel" id="telefono" name="telefono" required placeholder="Ej: 809-505-9852">
            </div>
            <div class="form-group">
                <label for="tipo-proyecto"><i class="fa-solid fa-laptop-code"></i> ¿Qué solución necesitas? *</label>
                <select id="tipo-proyecto" name="tipo-proyecto" required>
                    <option value="">Selecciona una opción</option>
                    <option value="pagina-web">Página Web Corporativa</option>
                    <option value="tienda-online">Tienda Online / E-commerce</option>
                    <option value="optimizacion">Optimización Web</option>
                    <option value="sistema-gestion">Sistema Web a Medida</option>
                    <option value="otros">Otros servicios</option>
                </select>
            </div>
            <div class="form-group">
                <label for="presupuesto"><i class="fa-solid fa-dollar-sign"></i> Presupuesto estimado</label>
                <select id="presupuesto" name="presupuesto">
                    <option value="">Selecciona un rango</option>
                    <option value="pyme-basico">Idea inicial</option>
                    <option value="500-1000">USD $500 - $1,000</option>
                    <option value="1000-2500">USD $1,000 - $2,500</option>
                    <option value="2500+">USD $2,500+</option>
                </select>
            </div>
            <div class="form-group">
                <label for="plazo"><i class="fa-solid fa-calendar"></i> Plazo deseado</label>
                <select id="plazo" name="plazo">
                    <option value="">Selecciona un plazo</option>
                    <option value="urgente">Urgente</option>
                    <option value="1-mes">Aproximadamente 1 mes</option>
                    <option value="flexible">Flexible</option>
                </select>
            </div>
            <div class="form-group">
                <label for="descripcion"><i class="fa-solid fa-file-alt"></i> Detalles del proyecto *</label>
                <textarea id="descripcion" name="descripcion" rows="5" required placeholder="Cuéntame más sobre tu proyecto..."></textarea>
            </div>
            <div class="form-buttons">
                <button type="submit" class="btn-enviar"><i class="fa-solid fa-paper-plane"></i> Enviar Solicitud</button>
                <button type="reset" class="btn-limpiar"><i class="fa-solid fa-eraser"></i> Limpiar</button>
            </div>
        </form>
       
        <div id="mensaje-exito" class="mensaje-exito" style="display: none;">
            <button class="btn-cerrar-mensaje" id="btnCerrarMensaje">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <i class="fa-solid fa-circle-check" style="color: #25D366; font-size: 48px;"></i>
            <h3>¡Solicitud Recibida con Éxito!</h3>
            <p>Se ha generado tu ticket: <strong id="ticketNumero"></strong></p>
            <p>He recibido tus datos. Estaré revisando tu propuesta en menos de 24 horas.</p>
            <button id="btnNuevaCotizacion" class="btn-nueva-cotizacion">
                <i class="fa-solid fa-plus"></i> Crear otra solicitud
            </button>
        </div>
    </div>
</div>
<script type="module" src="../js/Frm-cotizar.js"></script>
